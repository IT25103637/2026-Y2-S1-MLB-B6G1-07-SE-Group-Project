<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden - Access Denied</title>
    <link rel="stylesheet" href="/css/safari-theme.css?v=7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--color-bg-light); padding: 20px; text-align: center;">

    <div style="background: var(--color-card-bg); width: 100%; max-width: 500px; padding: 48px 32px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--color-border);">
        <div style="width: 64px; height: 64px; background: #FEE2E2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; color: var(--color-danger);">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
        </div>
        <h1 style="font-size: 1.75rem; color: var(--color-danger); font-weight: 800; margin-bottom: 10px;">403 — Access Denied</h1>
        <p style="color: var(--color-text-muted); font-size: 1rem; margin-bottom: 28px; line-height: 1.6;">
            You do not have the required role permissions to access this administrative or staff management page.
        </p>

        <div style="display: flex; gap: 12px; justify-content: center;">
            <a href="/" class="btn btn-primary">Return to Home</a>
            <a href="/login" class="btn btn-outline">Switch Role / Login</a>
        </div>
    </div>

</body>
</html>
