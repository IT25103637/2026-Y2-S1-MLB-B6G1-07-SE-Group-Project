<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Sri Lanka Wild-Life Safari System</title>
    <link rel="stylesheet" href="/css/safari-theme.css?v=7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--color-bg-light); padding: 20px;">

    <div style="background: var(--color-card-bg); width: 100%; max-width: 440px; padding: 40px 32px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--color-border);">
        <div style="text-align: center; margin-bottom: 28px;">
            <h1 style="font-size: 1.5rem; color: var(--color-primary); font-weight: 800;">Reset Account Password</h1>
            <p style="color: var(--color-text-muted); font-size: 0.938rem; margin-top: 6px;">Enter your registered email and choose a new password</p>
        </div>

        <form id="resetForm" onsubmit="handleReset(event)">
            <div class="form-group" style="margin-bottom: 18px;">
                <label for="resetEmail">Registered Email</label>
                <input type="email" id="resetEmail" class="form-control" placeholder="user@safari.lk" required>
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label for="resetPass">New Password (Min. 6 chars)</label>
                <input type="password" id="resetPass" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-bottom: 20px;">Update Password</button>
        </form>

        <div style="text-align: center; font-size: 0.938rem; color: var(--color-text-muted);">
            <a href="/login" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">&larr; Return to Sign In</a>
        </div>
    </div>

    <script>
        async function handleReset(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const newPassword = document.getElementById('resetPass').value;

            try {
                const res = await fetch(`/api/auth/forgot-password?email=${encodeURIComponent(email)}&newPassword=${encodeURIComponent(newPassword)}`, {
                    method: 'POST'
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    alert(data.message);
                    window.location.href = '/login';
                } else {
                    alert(data.message || 'Password reset failed');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
    </script>
</body>
</html>
